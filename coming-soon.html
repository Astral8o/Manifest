<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventory · Coming soon to Trinidad &amp; Tobago</title>
<meta name="description" content="One place to find and book every vendor for your next event in Trinidad &amp; Tobago: caterers, venues, photographers and more. Coming soon.">
<meta name="robots" content="noindex">
<meta property="og:title" content="Eventory · Coming soon">
<meta property="og:description" content="One place to find and book every vendor for your next event in Trinidad &amp; Tobago.">
<meta property="og:image" content="https://www.eventorytt.com/og-image.jpg">
<link rel="preload" as="image" href="/assets/hero/bar.jpg">
<style>
@font-face {
  font-family: 'Archivo Black';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/assets/fonts/a681334a.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'IBM Plex Mono';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/assets/fonts/cdfd78a5.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Manrope';
  font-style: normal;
  font-weight: 500;
  font-display: swap;
  src: url("/assets/fonts/a7a79df4.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Manrope';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url("/assets/fonts/a7a79df4.woff2") format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: #171717; }
body { font-family: Manrope, sans-serif; color: #fff; }
.wrap { min-height: 100vh; min-height: 100svh; position: relative; display: flex; align-items: center; justify-content: center; padding: 24px 16px; overflow: hidden; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(1.05); }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,23,23,.55) 0%, rgba(23,23,23,.78) 55%, rgba(23,23,23,.92) 100%); }
.box { position: relative; width: 100%; max-width: 480px; text-align: center; }
.badge { display: inline-flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 6px 14px; font: 400 11px/1.4 'IBM Plex Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: #E0512B; }
h1 { margin: 22px 0 0; font: 400 clamp(34px, 7vw, 52px)/1.05 'Archivo Black', Archivo, sans-serif; letter-spacing: -.02em; }
.lead { margin: 14px 0 0; font-size: 17px; line-height: 1.55; color: rgba(255,255,255,.88); font-weight: 500; }
form { margin-top: 28px; display: grid; gap: 10px; }
.roles { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.roles label { cursor: pointer; }
.roles input { position: absolute; opacity: 0; pointer-events: none; }
.roles span { display: inline-block; border: 1px solid rgba(255,255,255,.3); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 700; color: rgba(255,255,255,.85); }
.roles input:checked + span { background: #fff; color: #171717; border-color: #fff; }
.roles input:focus-visible + span { outline: 2px solid #fff; outline-offset: 2px; }
.field { display: flex; gap: 8px; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; background: rgba(255,255,255,.08); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); padding: 6px; }
.field input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #fff; padding: 10px 14px; font: 500 16px Manrope, sans-serif; }
.field input::placeholder { color: rgba(255,255,255,.55); }
button { border: 0; border-radius: 999px; background: #E0512B; color: #fff; padding: 12px 22px; font: 700 14px Manrope, sans-serif; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
button:hover { background: #B8401F; }
button[disabled] { opacity: .5; cursor: default; }
.err { font-size: 13px; color: #FFD9CC; min-height: 0; }
.done { margin-top: 28px; border: 1px solid rgba(255,255,255,.25); border-radius: 18px; background: rgba(255,255,255,.08); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); padding: 20px; }
.done b { font-size: 16px; }
.done p { margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: rgba(255,255,255,.8); }
.small { margin-top: 22px; font: 400 11px/1.6 'IBM Plex Mono', monospace; letter-spacing: .06em; color: rgba(255,255,255,.55); }
.small a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
@media (max-width: 380px) { .field { flex-direction: column; border-radius: 22px; } button { width: 100%; } }
</style>
</head>
<body>
<main class="wrap">
  <img class="bg" src="/assets/hero/bar.jpg" alt="">
  <div class="shade"></div>
  <div class="box">
    <div class="badge"><span class="dot"></span>Coming soon to Trinidad &amp; Tobago</div>
    <h1>Eventory</h1>
    <p class="lead">One place to find and book every vendor for your next event: caterers, venues, photographers and more. We're putting the finishing touches on it.</p>
    <form id="wl" novalidate>
      <div class="roles" role="radiogroup" aria-label="I am">
        <label><input type="radio" name="role" value="planner" checked><span>I'm planning an event</span></label>
        <label><input type="radio" name="role" value="vendor"><span>I'm a vendor</span></label>
      </div>
      <div class="field">
        <input type="email" name="email" required autocomplete="email" placeholder="you@organisation.tt" aria-label="Email">
        <button type="submit">Notify me</button>
      </div>
      <div class="err" id="err" role="alert"></div>
    </form>
    <div class="done" id="done" hidden><b>You're on the list</b><p id="doneText"></p></div>
    <div class="small">No spam, just one email when we're live.<br><a href="https://www.re5agency.com" target="_blank" rel="noopener noreferrer">By Re5Agency</a></div>
  </div>
</main>
<script>
(function () {
  var form = document.getElementById('wl'), err = document.getElementById('err'), btn = form.querySelector('button');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = form.email.value.trim(), role = form.role.value;
    if (!/^\S+@\S+\.\S+$/.test(email)) { err.textContent = 'Enter a valid email address.'; return; }
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Joining…';
    fetch('https://oiwjuvzsydhuhmetcuqk.supabase.co/rest/v1/waitlist', {
      method: 'POST',
      headers: { apikey: 'sb_publishable_qYk_KouIw772oOXdIvr7uA_zwhPVmtF', 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({ email: email, role: role })
    }).then(function (r) {
      // 409: already on the list, which is fine.
      if (!r.ok && r.status !== 409) throw new Error();
      form.hidden = true;
      document.getElementById('doneText').textContent = 'We’ll email ' + email + ' the moment Eventory launches.';
      document.getElementById('done').hidden = false;
    }).catch(function () {
      err.textContent = 'Something went wrong. Please try again.';
      btn.disabled = false; btn.textContent = 'Notify me';
    });
  });
})();
</script>
</body>
</html>
