<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #141210; --cream: #FFF6E5; --pink: #FF8FB8; --sun: #FFC531; --tomato: #F0412F; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Archivo, sans-serif; color: var(--ink);
    background: var(--sun) repeating-linear-gradient(135deg, rgba(255,255,255,.22) 0 30px, transparent 30px 60px); }
  .abs { position: absolute; }
  .display { font-family: Anton; text-transform: uppercase; line-height: .86; }
  .tape { position: absolute; left: -200px; width: 1700px; height: 96px; background: var(--ink); color: var(--sun);
    display: flex; align-items: center; white-space: nowrap; font-family: Anton; font-size: 54px; letter-spacing: .08em; }
  #tape1 { top: 220px; transform: rotate(-4deg); }
  #tape2 { top: 1450px; transform: rotate(3deg); background: var(--pink); color: var(--ink); border-top: 6px solid var(--ink); border-bottom: 6px solid var(--ink); }
  #biz { left: 90px; top: 400px; font-weight: 800; font-size: 44px; letter-spacing: .14em; }
  #title { left: 90px; top: 465px; width: 960px; font-size: 108px; }
  #was { left: 90px; top: 690px; font-size: 110px; color: rgba(20,18,16,.45); }
  #strike { left: 80px; top: 735px; height: 16px; background: var(--tomato); border-radius: 8px; transform: rotate(-4deg); transform-origin: left center; }
  #now { left: 70px; top: 830px; font-size: 300px; transform-origin: left top; }
  #burst { left: 770px; top: 860px; width: 250px; height: 250px; background: var(--tomato); color: var(--cream); display: grid; place-items: center;
    font-family: Anton; font-size: 76px; line-height: 1;
    clip-path: polygon(50% 0%,60.35% 11.36%,75% 6.7%,78.28% 21.72%,93.3% 25%,88.64% 39.65%,100% 50%,88.64% 60.35%,93.3% 75%,78.28% 78.28%,75% 93.3%,60.35% 88.64%,50% 100%,39.65% 88.64%,25% 93.3%,21.72% 78.28%,6.7% 75%,11.36% 60.35%,0% 50%,11.36% 39.65%,6.7% 25%,21.72% 21.72%,25% 6.7%,39.65% 11.36%); }
  #cta { left: 90px; top: 1210px; background: var(--ink); color: var(--cream); border-radius: 999px; padding: 24px 42px; font-weight: 800; font-size: 48px;
    box-shadow: 10px 10px 0 var(--pink); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <div id="tape1" class="tape"><span>BLACK FRIDAY ✦ BLACK FRIDAY ✦ BLACK FRIDAY ✦ BLACK FRIDAY ✦ BLACK FRIDAY ✦ BLACK FRIDAY ✦</span></div>
  <div id="biz" class="abs">SACHA COSMETICS</div>
  <div id="title" class="abs display">Cream-to-Powder<br>Foundation</div>
  <div id="was" class="abs display">TT$100</div>
  <div id="strike" class="abs"></div>
  <div id="now" class="abs display">TT$75</div>
  <div id="burst" class="abs"><span>-25%</span></div>
  <div id="cta" class="abs">Shop online · shopsacha.com</div>
  <div id="tape2" class="tape"><span>BEAUTY DEAL ✦ BEAUTY DEAL ✦ BEAUTY DEAL ✦ BEAUTY DEAL ✦ BEAUTY DEAL ✦ BEAUTY DEAL ✦</span></div>
</div>
<script>
  const clamp = (x) => Math.max(0, Math.min(1, x));
  const prog = (t, a, b) => clamp((t - a) / (b - a));
  const outCubic = (x) => 1 - Math.pow(1 - x, 3);
  const outBack = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const $ = (id) => document.getElementById(id);
  const tf = (id, s, o) => { const e = $(id); e.style.transform = s; if (o !== undefined) e.style.opacity = o; };

  window.DURATION = 2;
  window.render = (t) => {
    // Tapes scroll the whole time
    tf('tape1', `rotate(-4deg) translateX(${-((t * 320) % 470)}px)`);
    tf('tape2', `rotate(3deg) translateX(${-470 + ((t * 320) % 470)}px)`);
    // 0.00–0.35 name in
    const a = outCubic(prog(t, 0.0, 0.25));
    tf('biz', `translateX(${(1 - a) * -200}px)`, a);
    const b = outCubic(prog(t, 0.05, 0.35));
    tf('title', `translateX(${(1 - b) * -500}px) skewX(${(1 - b) * -10}deg)`, b);
    // 0.35–0.75 old price, strike
    const c = outCubic(prog(t, 0.35, 0.5));
    tf('was', `translateY(${(1 - c) * 40}px)`, c);
    $('strike').style.width = `${outCubic(prog(t, 0.5, 0.7)) * 310}px`;
    // 0.70–1.05 new price punches, burst pops
    const d = prog(t, 0.7, 0.95);
    tf('now', `scale(${0.2 + 0.8 * outBack(d)}) rotate(${(1 - outCubic(d)) * -8}deg)`, d > 0 ? 1 : 0);
    const e = prog(t, 0.85, 1.05);
    tf('burst', `scale(${outBack(e)}) rotate(${10 + Math.sin(t * 6) * 6}deg)`, e > 0 ? 1 : 0);
    // 1.05–1.30 call to action, then hold with a pulse
    const f = prog(t, 1.05, 1.3);
    tf('cta', `scale(${(0.7 + 0.3 * outBack(f)) * (t > 1.3 ? 1 + Math.sin((t - 1.3) * 9) * 0.03 : 1)})`, f > 0 ? 1 : 0);
  };
  window.render(0);
</script>
</body>
</html>
