<!doctype html><html><head><meta charset="utf-8">

<style>
*{box-sizing:border-box;margin:0}body{background:#888}
.s{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Archivo,sans-serif;color:#141210;margin-bottom:20px}

.burst{width:300px;height:300px;background:#F0412F;color:#FFF6E5;display:grid;place-items:center;font-family:Anton;font-size:96px;transform:rotate(-10deg);

.stripes{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.2) 0 30px,transparent 30px 60px)}
</style></head><body>
