<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Archivo,sans-serif;color:#141210;
 background:#FFC531 repeating-linear-gradient(135deg,rgba(255,255,255,.2) 0 30px,transparent 30px 60px)}
.abs{position:absolute}.d{font-family:Anton;text-transform:uppercase;line-height:.86}
.chip{border:6px solid #141210;border-radius:999px;background:#FFF6E5;font-weight:900;font-size:54px;padding:12px 40px}
.card{left:90px;top:300px;width:900px;height:860px;border:8px solid #141210;border-radius:60px;overflow:hidden;box-shadow:18px 18px 0 #141210;background:#fff}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.card img.fill{object-fit:cover;filter:blur(30px);transform:scale(1.2);opacity:.6}
.price{left:100px;top:1260px;font-size:230px}
.was{left:110px;top:1490px;font-size:72px;font-weight:900;opacity:.55;text-decoration:line-through;text-decoration-thickness:8px;text-decoration-color:#F0412F}
.name{left:110px;top:1600px;width:880px;font-size:56px;font-weight:900}
.burst{left:760px;top:1000px;width:280px;height:280px;background:#F0412F;color:#FFF6E5;display:grid;place-items:center;font-family:Anton;font-size:88px;
 clip-path:polygon(50% 0%,60.35% 11.36%,75% 6.7%,78.28% 21.72%,93.3% 25%,88.64% 39.65%,100% 50%,88.64% 60.35%,93.3% 75%,78.28% 78.28%,75% 93.3%,60.35% 88.64%,50% 100%,39.65% 88.64%,25% 93.3%,21.72% 78.28%,6.7% 75%,11.36% 60.35%,0% 50%,11.36% 39.65%,6.7% 25%,21.72% 21.72%,25% 6.7%,39.65% 11.36%)}
</style></head><body><div id="stage">
 <div id="intro">
  <div class="abs chip" id="chip" style="left:90px;top:330px">🛋️ Shopping</div>
  <div class="abs d" id="w1" style="left:80px;top:520px;font-size:330px">Up to</div>
  <div class="abs d" id="w2" style="left:80px;top:820px;font-size:270px;white-space:nowrap;color:#FFF6E5;-webkit-text-stroke:10px #141210">45% off</div>
  <div class="abs" id="w3" style="left:90px;top:1150px;font-size:64px;font-weight:900">Black Friday at Courts</div>
 </div>
 <div id="deals"></div>
 <div id="outro" class="abs" style="inset:0">
  <div class="abs d" style="left:80px;top:560px;font-size:230px">Before<br>it sells<br>out.</div>
  <div class="abs chip" style="left:90px;top:1240px;background:#141210;color:#FFF6E5;font-size:64px;padding:20px 50px;box-shadow:12px 12px 0 #F0412F">Link in bio</div>
 </div>
</div>
<script>
const D=[['/home/claude/repo/public/deals/courts/serta-divan.webp','TT$2,199','TT$3,999',45,'Serta Pillow Top Divan'],
 ['/home/claude/repo/public/deals/courts/mastertech-microwave.webp','TT$499','TT$799',38,'Mastertech Microwave'],
 ['/home/claude/repo/public/deals/courts/radioshack-speaker.webp','TT$1,599','TT$2,199',27,'RadioShack 15" Speaker'],
 ['/home/claude/repo/public/deals/courts/mabe-stove.webp','TT$2,499','TT$3,299',24,'Mabe 6 Burner Stove'],
 ['/home/claude/repo/public/deals/courts/skempton.webp','TT$6,999','TT$8,999',22,'Skempton 6-Chair Dining Set']];
const box=document.getElementById('deals');
D.forEach(([src,p,w,pct,n],i)=>{box.insertAdjacentHTML('beforeend',`<div class="abs" id="d${i}" style="inset:0"><div class="abs card"><img class="fill" src="file://${src}"><img src="file://${src}"></div><div class="abs burst">-${pct}%</div><div class="abs d price">${p}</div><div class="abs was">${w}</div><div class="abs name">${n}</div></div>`)});
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
const pop=x=>{x=Math.min(Math.max(x,0),1);return x<.6?1.25*ease(x/.6):1.25-.25*ease((x-.6)/.4)};
window.DURATION=8;
const IN=1.2, EACH=1.1, OUT=IN+5*EACH;
const tr=(id,v,o='left top')=>{const el=document.getElementById(id);el.style.transform=v;el.style.transformOrigin=o};
window.render=(t)=>{
  document.getElementById('intro').style.display=t<IN?'block':'none';
  tr('chip',`translateX(${(1-ease(t/.3))*-900}px)`);
  tr('w1',`scale(${pop((t-.1)/.4)})`); tr('w2',`scale(${pop((t-.4)/.4)})`);
  document.getElementById('w3').style.opacity=ease((t-.7)/.3);
  D.forEach((_,i)=>{const s=IN+i*EACH,el=document.getElementById('d'+i),on=t>=s&&t<s+EACH;el.style.display=on?'block':'none';
    if(on){const k=(t-s)/EACH;el.querySelector('.card').style.transform=`rotate(${(i%2?2:-2)}deg) scale(${1.06-.06*ease(k*2.5)})`;
      const pr=el.querySelector('.price');pr.style.transform=`scale(${pop(k*2.8)})`;pr.style.transformOrigin='left center';
      const b=el.querySelector('.burst');b.style.transform=`scale(${pop((k-.15)*3)}) rotate(${-12+12*ease(k*3)}deg)`;}});
  document.getElementById('outro').style.display=t>=OUT?'block':'none';
  document.getElementById('stage').style.backgroundColor=t>=OUT?'#FF8FB8':'#FFC531';
};
window.READY=Promise.all([...document.images].map(im=>im.decode().catch(()=>{})));
window.render(0);
</script></body></html>
