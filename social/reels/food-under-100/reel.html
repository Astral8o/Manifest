<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}html,body{width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Archivo,sans-serif;color:#141210;
 background:#FF8A3D repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 30px,transparent 30px 60px)}
.abs{position:absolute}.d{font-family:Anton;text-transform:uppercase;line-height:.86}
.chip{border:6px solid #141210;border-radius:999px;background:#FFF6E5;font-weight:900;font-size:54px;padding:12px 40px}
.card{left:90px;top:330px;width:900px;height:900px;border:8px solid #141210;border-radius:60px;overflow:hidden;box-shadow:18px 18px 0 #141210;background:#fff}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}.card img.fill{object-fit:cover;filter:blur(30px);transform:scale(1.2);opacity:.7}
.price{left:110px;top:1300px;font-size:300px}
.name{left:110px;top:1600px;width:880px;font-size:58px;font-weight:900}
</style></head><body><div id="stage">
 <div id="intro">
  <div class="abs chip" id="chip" style="left:90px;top:330px">🍕 Food</div>
  <div class="abs d" id="w1" style="left:80px;top:520px;font-size:330px">Under</div>
  <div class="abs d" id="w2" style="left:80px;top:820px;font-size:330px;color:#FFF6E5;-webkit-text-stroke:10px #141210">TT$100</div>
 </div>
 <div id="deals"></div>
 <div id="outro" class="abs" style="inset:0">
  <div class="abs d" style="left:80px;top:620px;font-size:250px">Lunch<br>sorted.</div>
  <div class="abs chip" style="left:90px;top:1180px;background:#141210;color:#FFF6E5;font-size:64px;padding:20px 50px;box-shadow:12px 12px 0 #FFC531">Link in bio</div>
 </div>
</div>
<script>
const D=[['/home/claude/repo/public/deals/marios/MAR-007.webp','TT$39','Pizza, snack & drink'],['/home/claude/repo/public/deals/marios/MAR-001.webp','TT$43','Burger & slushie'],
 ['/home/claude/repo/public/deals/marios/MAR-010.webp','TT$69','2 burgers & 2 drinks'],['/home/claude/repo/public/deals/dominos/DOM-001.webp','TT$99','Any 1-topping pan pizza'],['/home/claude/repo/public/deals/dominos/DOM-003.webp','TT$99','XL 16" pizza']];
const box=document.getElementById('deals');
D.forEach(([src,p,n],i)=>{box.insertAdjacentHTML('beforeend',`<div class="abs" id="d${i}" style="inset:0"><div class="abs card"><img class="fill" src="file://${src}"><img src="file://${src}"></div><div class="abs d price">${p}</div><div class="abs name">${n}</div></div>`)});
const ease=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
const pop=x=>{x=Math.min(Math.max(x,0),1);return x<.6?1.25*ease(x/.6):1.25-.25*ease((x-.6)/.4)};
window.DURATION=3;
window.render=(t)=>{
  // 0–0.7s intro, 0.7–2.45s five deals (0.35s each), 2.45–3s outro
  const I=document.getElementById('intro'); I.style.display=t<0.7?'block':'none';
  document.getElementById('chip').style.transform=`translateX(${(1-ease(t/.15))*-900}px)`;
  document.getElementById('w1').style.transform=`scale(${pop((t-.05)/.25)})`;document.getElementById('w1').style.transformOrigin='left top';
  document.getElementById('w2').style.transform=`scale(${pop((t-.2)/.25)})`;document.getElementById('w2').style.transformOrigin='left top';
  D.forEach((_,i)=>{const s=.7+i*.35,el=document.getElementById('d'+i),on=t>=s&&t<s+.35;el.style.display=on?'block':'none';
    if(on){const k=(t-s)/.35;el.querySelector('.card').style.transform=`rotate(${(i%2?2:-2)}deg) scale(${1.08-.08*ease(k*3)})`;
      el.querySelector('.price').style.transform=`scale(${pop(k*2.2)})`;el.querySelector('.price').style.transformOrigin='left center';}});
  document.getElementById('outro').style.display=t>=2.45?'block':'none';
  document.getElementById('stage').style.backgroundColor=t>=2.45?'#FFC531':'#FF8A3D';
};
window.READY=Promise.all([...document.images].map(im=>im.decode().catch(()=>{})));
window.render(0);
</script></body></html>
