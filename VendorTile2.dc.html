<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
</helmet>
<div style="display:flex;flex-direction:column;height:100%;border:1px solid var(--line-hairline);border-radius:24px;background:var(--surface);overflow:hidden;font-family:var(--font-sans);color:var(--ink);">
  <div style="position:relative;aspect-ratio:4/3;background:var(--ink);overflow:hidden;">
    <img onClick="{{ v.open }}" src="{{ v.img }}" alt="{{ v.name }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;cursor:pointer;">
    <div style="position:absolute;top:12px;right:12px;">
      <sc-if value="{{ v.saved }}" hint-placeholder-val="{{ false }}">
        <x-import component-from-global-scope="EventoryDesignSystem_d28b5d.Button" variant="accent" size="sm" onClick="{{ v.save }}" hint-size="80px,36px">Saved</x-import>
      </sc-if>
      <sc-if value="{{ v.notSaved }}" hint-placeholder-val="{{ true }}">
        <x-import component-from-global-scope="EventoryDesignSystem_d28b5d.Button" variant="onDark" size="sm" onClick="{{ v.save }}" hint-size="80px,36px">+ Save</x-import>
      </sc-if>
    </div>
    <sc-if value="{{ v.isSpotlight }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:14px;left:14px;">
        <x-import component-from-global-scope="EventoryDesignSystem_d28b5d.PromoBadge" hint-size="80px,24px">Spotlight</x-import>
      </div>
    </sc-if>
  </div>
  <div style="flex:1;display:flex;flex-direction:column;gap:6px;padding:18px 20px 20px;">
    <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--fg-5);">{{ v.catLabel }} · {{ v.location }}</div>
    <div onClick="{{ v.open }}" style="font-size:18px;font-weight:700;letter-spacing:-0.01em;cursor:pointer;">{{ v.name }}</div>
    <div style="font-size:14px;line-height:1.5;color:var(--fg-2);text-wrap:pretty;">{{ v.tagline }}</div>
    <div style="margin-top:auto;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <div style="display:grid;gap:2px;">
        <span style="font-family:var(--font-mono);font-size:10px;letter-spacing:0.08em;color:var(--fg-6);">FROM</span>
        <span style="font-family:var(--font-mono);font-size:13px;color:var(--ink);">{{ v.from }}</span>
      </div>
      <x-import component-from-global-scope="EventoryDesignSystem_d28b5d.Button" variant="solid" size="sm" onClick="{{ v.inquire }}" hint-size="90px,36px">Inquire</x-import>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:460},&quot;v&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
